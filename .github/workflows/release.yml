name: Wails Release Build

on:
  workflow_dispatch: # Allows manual triggering from the GitHub UI
  push:
    tags:
      - 'v*' # This workflow runs automatically when you push a tag like v1.0.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: windows-amd64
            os: windows-latest
            platform: windows/amd64
          - build: windows-arm64
            os: windows-latest
            platform: windows/arm64
          - build: macos-universal
            os: macos-latest
            platform: darwin/universal
          - build: linux-amd64
            os: ubuntu-latest
            platform: linux/amd64
          - build: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # Linux requires system dependencies to build the WebKit bindings
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App
        run: wails build -platform ${{ matrix.platform }} -tags webkit2_41

      # We must zip the macOS .app folder because GitHub Releases cannot accept raw folders
      - name: Zip macOS App Bundle
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          zip -r pdfcutter-${{ matrix.build }}.zip pdfcutter.app
          rm -rf pdfcutter.app

      # Rename Linux and Windows binaries so they don't overwrite each other in the release
      - name: Rename Linux Binary
        if: runner.os == 'Linux'
        run: mv build/bin/pdfcutter build/bin/pdfcutter-${{ matrix.build }}

      - name: Rename Windows Binary
        if: runner.os == 'Windows'
        run: Rename-Item -Path "build\bin\pdfcutter.exe" -NewName "pdfcutter-${{ matrix.build }}.exe"

      # Upload all final renamed binaries/zips to a new GitHub Release!
      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/*
