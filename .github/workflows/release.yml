name: Wails Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: windows-amd64
            os: windows-latest
            platform: windows/amd64
          - build: windows-arm64
            os: windows-latest
            platform: windows/arm64
          - build: macos-universal
            os: macos-latest
            platform: darwin/universal
          - build: linux-amd64
            os: ubuntu-latest
            platform: linux/amd64
          - build: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update 
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev ruby ruby-dev rubygems
          sudo gem install fpm

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis

      - name: Build Windows App
        if: runner.os == 'Windows'
        run: wails build -platform ${{ matrix.platform }} -nsis
        
      - name: Build Mac/Linux App
        if: runner.os != 'Windows'
        run: wails build -platform ${{ matrix.platform }} -tags webkit2_41

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          hdiutil create -volname "PDFStudio" -srcfolder pdfcutter.app -ov -format UDZO pdfcutter-${{ matrix.build }}.dmg
          rm -rf pdfcutter.app

      - name: Create Linux DEB
        if: runner.os == 'Linux'
        run: |
          cd build/bin
          fpm -s dir -t deb -n "pdfcutter" -v "1.0.0" -p pdfcutter-${{ matrix.build }}.deb pdfcutter=/usr/local/bin/pdfcutter
          rm pdfcutter
          
      - name: Clean up Windows Raw Binaries
        if: runner.os == 'Windows'
        run: Remove-Item -Path "build\bin\pdfcutter.exe"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfcutter-${{ matrix.build }}
          path: build/bin/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Move Latest Tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin -f latest

      - name: Create Continuous Release (Latest)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ${{ github.event.head_commit.message }}
          prerelease: true
          files: artifacts/*

      - name: Create Stable Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
